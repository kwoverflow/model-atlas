name: model-atlas-mvp-review

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: model_atlas_review
      POSTGRES_USER: model_atlas_review
      POSTGRES_PASSWORD: local-review-only
    volumes:
      - review-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U model_atlas_review -d model_atlas_review"]
      interval: 3s
      timeout: 3s
      retries: 30

  backend:
    build: ../backend
    environment:
      DATABASE_URL: postgresql+psycopg://model_atlas_review:local-review-only@db:5432/model_atlas_review
      BACKEND_CORS_ORIGINS: http://localhost:${MVP_REVIEW_UI_PORT:-13000}
      MODEL_ATLAS_REPOSITORY_ROOT: /workspace
      TRUSTED_OPERATOR_HEADERS_ENABLED: "true"
      TRUSTED_PROXY_NETWORKS: 127.0.0.1/32,::1/128,172.16.0.0/12
      OPERATIONAL_PAGING_ENABLED: "false"
      OIDC_JWT_ENABLED: "false"
      OIDC_BROWSER_LOGIN_ENABLED: "false"
      MODEL_ATLAS_INSTANCE_NAME: mvp-review-backend
    volumes:
      - ../reference_workload:/workspace/reference_workload:ro
      - ../docs:/workspace/docs:ro
      - ../data:/data:ro
      - ../EVALUATOR_GUIDE_KO.md:/workspace/EVALUATOR_GUIDE_KO.md:ro
    ports:
      - "127.0.0.1:${MVP_REVIEW_API_PORT:-18010}:8000"
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 30

  frontend:
    build:
      context: ../frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:${MVP_REVIEW_API_PORT:-18010}/api/v1
    environment:
      SERVER_API_URL: http://backend:8000/api/v1
    ports:
      - "127.0.0.1:${MVP_REVIEW_UI_PORT:-13000}:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  review-db:
