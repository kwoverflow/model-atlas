[project]
name = "model-atlas-backend"
version = "0.1.0"
description = "FastAPI backend for the Model Atlas local EvalOps foundation."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13.3",
    "fastapi>=0.115.0",
    "httpx>=0.27.2",
    "psycopg[binary]>=3.2.2",
    "pydantic>=2.9.2",
    "PyJWT[crypto]>=2.10.1",
    "pypdf>=5.1.0",
    "pytest>=8.3.3",
    "reportlab>=4.2.5",
    "ruff>=0.6.8",
    "sqlalchemy>=2.0.35",
    "uvicorn[standard]>=0.30.6",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"app/api/v1/routes/*.py" = ["B008"]
